<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attractor · EMERGENCE No.3</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
  * { margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0b0e; overflow: hidden; }
  #sig {
    position: fixed; left: 22px; bottom: 18px; z-index: 10;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: rgba(200,210,225,0.32); font-size: 11px; letter-spacing: 2px;
    pointer-events: none; user-select: none;
  }
  #hint {
    position: fixed; right: 22px; bottom: 18px; z-index: 10;
    font-family: ui-monospace, Menlo, monospace;
    color: rgba(200,210,225,0.20); font-size: 10px; letter-spacing: 1px;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
  <div id="sig">ATTRACTOR&nbsp;·&nbsp;EMERGENCE&nbsp;No.3</div>
  <div id="hint">CLICK / SPACE → 换种子</div>
<script>
let SEED = 42;
const STOPS = ['#2ec5b6', '#5bb0ff', '#7b6cff', '#ff6b8a', '#ffb36b'];
const N = 26000;   // 每帧点数（拖尾累积 → 总密度更高）

// 动画状态：基准参数 + 持续迭代点
let base = null, px = 0.1, py = 0.1;

let RAMP = [];
function rampColor(t) {
  if (!RAMP.length) RAMP = STOPS.map(h => color(h));
  const seg = (RAMP.length - 1) * constrain(t, 0, 0.9999);
  const i = Math.floor(seg);
  return lerpColor(RAMP[i], RAMP[i + 1], seg - i);
}

function setup() { createCanvas(windowWidth, windowHeight); pixelDensity(2); frameRate(30); reset(); }
function windowResized() { resizeCanvas(windowWidth, windowHeight); background(11, 11, 14); }
function keyPressed() { if (key === ' ') reset(true); }
function mousePressed() { reset(true); }

// 选一组非退化基准参数（每种子一套），重置画布与迭代点
function reset(reroll) {
  if (reroll) SEED = floor(random(99999));
  randomSeed(SEED);
  let a, b, c, d, tries = 0;
  while (tries < 40) {
    a = random(-2.6, 2.6); b = random(-2.6, 2.6); c = random(-2.6, 2.6); d = random(-2.6, 2.6);
    let tx = 0.1, ty = 0.1, minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
    for (let i = 0; i < 1600; i++) {
      const nx = Math.sin(a * ty) - Math.cos(b * tx);
      const ny = Math.sin(c * tx) - Math.cos(d * ty);
      tx = nx; ty = ny;
      if (i > 300) {
        minx = Math.min(minx, tx); maxx = Math.max(maxx, tx);
        miny = Math.min(miny, ty); maxy = Math.max(maxy, ty);
      }
    }
    tries++;
    if ((maxx - minx) > 1.3 && (maxy - miny) > 1.3) break;   // 够展开 → 用它
  }
  base = { a, b, c, d };
  px = random(-1, 1); py = random(-1, 1);
  background(11, 11, 14);
}

function draw() {
  // 拖尾：每帧用半透明底色轻擦上一帧 → 流动残影 + 密度累积
  blendMode(BLEND);
  noStroke();
  fill(11, 11, 14, 18);
  rect(0, 0, width, height);

  // 参数绕基准小幅漂移（贴着非退化基准走，避免坍缩成细线）→ 丝缦缓慢流动
  const t = frameCount * 0.01;
  const a = base.a + Math.sin(t * 0.70) * 0.18;
  const b = base.b + Math.cos(t * 0.53) * 0.18;
  const c = base.c + Math.sin(t * 0.31) * 0.18;
  const d = base.d + Math.cos(t * 0.87) * 0.18;

  const scale = min(width, height) * 0.21;
  const cx = width / 2, cy = height / 2;

  blendMode(ADD);
  strokeWeight(1.0);
  let x = px, y = py;
  for (let i = 0; i < N; i++) {
    const nx = Math.sin(a * y) - Math.cos(b * x);
    const ny = Math.sin(c * x) - Math.cos(d * y);
    const speed = Math.hypot(nx - x, ny - y);   // 移动速度 → 上色
    x = nx; y = ny;
    const col = rampColor(constrain(speed / 3.2, 0, 1));
    stroke(red(col), green(col), blue(col), 12);
    point(cx + x * scale, cy + y * scale);
  }
  blendMode(BLEND);
  px = x; py = y;   // 保留迭代状态供下一帧续算
}
</script>
</body>
</html>
